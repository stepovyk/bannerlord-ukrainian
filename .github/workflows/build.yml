name: Збирання

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Перевірка перекладу
        run: python3 tools/check.py

      - name: Граматичний обробник
        run: dotnet build src/UkrainianLocalization -c Release

      - name: Мод
        run: python3 tools/build.py --zip

      - uses: actions/upload-artifact@v7
        with:
          name: UkrainianLocalization
          path: dist/*.zip

      - name: Випуск
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip="dist/UkrainianLocalization-${TAG}.zip"
          if [ ! -f "$zip" ]; then
            echo "Тег $TAG не збігається з MOD_VERSION у tools/build.py"
            exit 1
          fi
          awk -v tag="## $TAG" '$0 == tag {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "У CHANGELOG.md немає розділу $TAG"
            exit 1
          fi
          printf '\n[Як установити](https://github.com/%s#встановлення)\n' "$GITHUB_REPOSITORY" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
          else
            gh release create "$TAG" "$zip" --title "Українська локалізація $TAG" --notes-file notes.md
          fi
